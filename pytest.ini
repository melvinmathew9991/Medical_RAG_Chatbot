[pytest]
testpaths = tests

# Anything that reaches the network or spends Gemini free-tier quota (500 RPD)
# is marked `live` so the default run stays offline, deterministic, and free:
#
#     pytest                  # offline tests only (see addopts below)
#     pytest -m live          # just the live ones
#     pytest -m ""            # everything, spends quota
#
# Sprint 5's CI has no API key, so it wants the default.
markers =
    live: needs a real GOOGLE_API_KEY and spends free-tier quota

addopts = -m "not live"
